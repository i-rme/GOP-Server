name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compiler error pages are part of the golden files, so pin the minor version.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: gofmt
        run: test -z "$(gofmt -l src test)" || { gofmt -l src test; exit 1; }

      - name: go vet
        run: |
          go vet ./src/...
          cd test/compat && go vet ./...

      - name: Unit tests
        run: go test -race ./src/...

      - name: Build server
        run: go build -o bin/gop-server ./src

      - name: Compat suite
        working-directory: test/compat
        env:
          GOP_SERVER_BIN: ${{ github.workspace }}/bin/gop-server
          GOP_COMPAT_OUT: ${{ runner.temp }}/compat-actual
        run: go test -count=1 -v .

      - name: Upload actual responses
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-actual
          path: ${{ runner.temp }}/compat-actual
          if-no-files-found: ignore
